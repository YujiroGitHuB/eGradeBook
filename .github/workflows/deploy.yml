name: Deploy to InfinityFree (manual)

# Hostinger na ang deploy target -- tingnan ang deploy-hostinger.yml, na
# tumatakbo sa bawat push sa master. Itinatago ito bilang daan pabalik sa
# lumang host, kaya MANU-MANO LANG: kung dalawang workflow ang sabay na
# pumutok sa iisang push, iisang commit ang mapupunta sa dalawang live site
# na magkaiba ang database. (Katulad ng ginawa sa FormFlow.)
on:
  workflow_dispatch:
jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    environment: Server   # dapat pareho sa environment name mo sa GitHub Secrets

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /lexon.free.nf/htdocs/eGradeBook/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md